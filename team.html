<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Leave — Digital Door Locks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --bg:#f5f5f7; --surface:#fff; --border:rgba(0,0,0,0.10); --text:#1d1d1f; --text-2:#6e6e73; --text-3:#8e8e93; --blue:#007aff; --green:#34c759; --amber:#ff9500; --radius:12px; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.bar{ background:#fff; border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
.bar-title{ font-size:14px; font-weight:700; }
.bar-sub{ font-size:11.5px; color:var(--text-3); margin-left:8px; font-weight:400; }
.who{ font-size:11px; color:var(--text-3); margin-right:10px; }
.out{ font-size:10.5px; font-weight:600; background:#f2f2f7; border:none; border-radius:999px; padding:4px 11px; cursor:pointer; font-family:inherit; color:var(--text-2); }
.wrap{ max-width:900px; margin:0 auto; padding:18px 20px 40px; }
.card{ background:var(--surface); border-radius:var(--radius); box-shadow:0 2px 16px rgba(0,0,0,0.08),0 1px 3px rgba(0,0,0,0.06); margin-bottom:14px; overflow:hidden; }
.card-head{ padding:12px 16px; border-bottom:1px solid var(--border); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; color:var(--text-3); display:flex; justify-content:space-between; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; padding:14px 16px; }
.tile{ border-radius:var(--radius); padding:16px; color:#fff; }
.tile.annual{ background:linear-gradient(135deg,#0a84ff 0%,#0060df 100%); }
.tile.personal{ background:linear-gradient(135deg,#34c759 0%,#1e7a35 100%); }
.tile-lbl{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.6px; opacity:0.85; font-weight:600; }
.tile-val{ font-size:27px; font-weight:700; margin-top:5px; letter-spacing:-0.5px; }
.tile-sub{ font-size:10.5px; opacity:0.8; margin-top:4px; }
.reqform{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:14px 16px; background:linear-gradient(180deg,#f8f9fc,#f3f5f9); border-top:1px solid var(--border); }
.reqform label{ display:block; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:5px; }
.fld{ height:34px; border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:12.5px; font-family:inherit; background:#fff; color:var(--text); }
.fld:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,0.12); }
.btn{ height:34px; padding:0 18px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; }
.btn:hover{ background:#0062cc; }
.btn.ghost{ background:var(--surface); color:var(--text-2); border:1px solid var(--border); }
.btn.ok{ background:var(--green); }
.btn.no{ background:#ff3b30; }
.btn.sm{ height:28px; padding:0 12px; font-size:11.5px; }
.reqmsg{ font-size:12px; padding:0 16px 12px; min-height:16px; color:var(--text-2); }
.reqmsg.err{ color:#c9271d; }
.reqmsg.ok{ color:#1e7a35; }
.rq{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.rq:last-child{ border-bottom:none; }
.rq-main{ flex:1 1 260px; min-width:0; }
.rq-when{ font-size:12.5px; font-weight:600; color:var(--text); }
.rq-meta{ font-size:11px; color:var(--text-3); margin-top:2px; }
.st{ font-size:10px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.st.pending{ background:rgba(255,149,0,0.16); color:#a35b00; }
.st.approved{ background:rgba(52,199,89,0.16); color:#1e7a35; }
.st.declined{ background:rgba(255,59,48,0.12); color:#c9271d; }
.st.cancelled{ background:rgba(142,142,147,0.18); color:var(--text-2); }
.vic-tile-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; padding:14px 16px; }
.vic-tile{ background:linear-gradient(135deg,#5ac8fa 0%,#2f9fd4 100%); border-radius:12px; padding:12px 10px; color:#fff; text-align:center; box-shadow:0 2px 10px rgba(47,159,212,0.25); }
.vic-tile.lv-away{ background:linear-gradient(135deg,#af52de 0%,#7d3aa5 100%); box-shadow:0 2px 10px rgba(125,58,165,0.25); }
.vic-tile.lv-annual{ background:linear-gradient(135deg,#0a84ff 0%,#0060df 100%); box-shadow:0 2px 10px rgba(0,96,223,0.25); }
.vic-tile.lv-personal{ background:linear-gradient(135deg,#34c759 0%,#1e7a35 100%); box-shadow:0 2px 10px rgba(30,122,53,0.25); }
.vic-tile.lv-unpaid{ background:linear-gradient(135deg,#8e8e93 0%,#636366 100%); box-shadow:0 2px 10px rgba(99,99,102,0.25); }
.vic-tile-day{ font-size:24px; font-weight:800; line-height:1; }
.vic-tile-mon{ font-size:9.5px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; opacity:0.9; margin-top:3px; }
.vic-tile-name{ font-size:10px; margin-top:6px; line-height:1.3; opacity:0.95; }
table{ width:100%; border-collapse:collapse; }
th{ background:#f2f2f7; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); padding:8px 16px; text-align:left; }
td{ font-size:12.5px; padding:9px 16px; border-bottom:1px solid var(--border); color:var(--text-2); }
.pill{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; }
.pill.annual{ background:rgba(0,122,255,0.12); color:#0056b3; }
.pill.personal{ background:rgba(52,199,89,0.16); color:#1e7a35; }
.pill.other{ background:rgba(142,142,147,0.16); color:var(--text-2); }
.empty{ padding:22px 16px; text-align:center; font-size:12px; color:var(--text-3); }
#gate{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:linear-gradient(160deg,#eef1f6,#e3e8f0); z-index:99; }
.auth{ width:330px; background:#fff; border-radius:14px; padding:30px 28px; box-shadow:0 10px 40px rgba(0,0,0,0.14); }
.auth h1{ font-size:15px; margin:0; }
.auth p{ font-size:11.5px; color:var(--text-3); margin:2px 0 20px; }
.auth label{ display:block; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin:12px 0 5px; }
.auth input{ width:100%; height:36px; border:1px solid var(--border); border-radius:8px; padding:0 11px; font-size:13px; font-family:inherit; }
.auth button{ width:100%; height:38px; margin-top:20px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.msg{ font-size:11.5px; color:#c9271d; margin-top:10px; min-height:14px; text-align:center; }
</style>
</head>
<body>

<div id="gate">
  <div class="auth">
    <h1>My Leave</h1>
    <p>Digital Door Locks Pty Limited</p>
    <label>Email</label>
    <input type="email" id="email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') signIn()">
    <button onclick="signIn()">Sign in</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <div><span class="bar-title">My Leave</span><span class="bar-sub">Digital Door Locks Pty Limited</span></div>
    <div><a href="index.html" id="adminLink" style="display:none;font-size:10.5px;font-weight:600;color:var(--blue);text-decoration:none;margin-right:12px">Dashboard →</a><span class="who" id="who"></span><button class="out" onclick="signOut()">Sign out</button></div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="card-head"><span>Leave Balance</span><span id="asOf"></span></div>
      <div class="tiles" id="balances"></div>
    </div>
    <div class="card" id="approvalsCard" style="display:none">
      <div class="card-head"><span>Leave Requests</span><span id="apprCount"></span></div>
      <div id="approvalsList"></div>
    </div>

    <div class="card">
      <div class="card-head"><span>Request Leave</span><span>Weekends and holidays are skipped</span></div>
      <div class="reqform">
        <div><label>Type</label><select id="reqType" class="fld">
          <option value="">Choose…</option>
          <option>Annual Leave</option><option>Personal Leave</option><option>Unpaid Leave</option>
        </select></div>
        <div><label>From</label><input type="date" id="reqFrom" class="fld"></div>
        <div><label>To</label><input type="date" id="reqTo" class="fld"></div>
        <div><label>Hours/day</label><input type="number" step="0.5" id="reqHours" class="fld" value="8" style="width:90px"></div>
        <div style="flex:1 1 200px"><label>Reason</label><input type="text" id="reqReason" class="fld" placeholder="Optional"></div>
        <div><label>&nbsp;</label><button class="btn" onclick="submitRequest()">Submit</button></div>
      </div>
      <div id="reqMsg" class="reqmsg"></div>
    </div>

    <div class="card">
      <div class="card-head"><span>My Requests</span><span id="myReqCount"></span></div>
      <div id="myRequests"></div>
    </div>
    <div class="card">
      <div class="card-head"><span>My Leave History</span><span id="leaveCount"></span></div>
      <div id="leaveList"></div>
    </div>
    <div class="card">
      <div class="card-head"><span>Who’s Away</span><span id="awayRange"></span></div>
      <div id="awayList"></div>
    </div>
    <div class="card">
      <div class="card-head"><span>Public Holidays</span><span>Victoria</span></div>
      <div id="holidayList"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://krehcrqqcykynqkqabfb.supabase.co";
const SUPABASE_KEY = "sb_publishable_9rrHEKoA7o9RAnp4G66m3w_3nhRfeEc";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ACCRUAL = { "Annual Leave": 13.33, "Personal Leave": 6.66 };
const HOURS_PER_DAY = 8;

function fmtDay(iso){
  if(!iso) return "";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()] + " " + d.getDate() + " " + mons[d.getMonth()] + " " + d.getFullYear();
}

function monthsBetween(from, to){
  var a = new Date(from + "T00:00:00"), b = new Date(to);
  var m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m -= 1;
  // Employee 203 credits the first month on joining, so count inclusively
  return Math.max(0, m) + 1;
}

async function signIn(){
  var email = document.getElementById("email").value.trim();
  var pass = document.getElementById("password").value;
  var msg = document.getElementById("msg");
  if(!email || !pass){ msg.textContent = "Enter your email and password."; return; }
  msg.textContent = "Signing in\u2026";
  const { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
  if(error){ msg.textContent = error.message; return; }
  msg.textContent = "";
  start();
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function start(){
  const { data } = await sb.auth.getSession();
  if(!data || !data.session){
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = data.session.user.email;
  const { data: adm } = await sb.rpc('is_admin');
  IS_ADMIN = !!adm;
  if(adm) document.getElementById('adminLink').style.display = 'inline';
  // Leave Approvers (semi-admin): get the Leave Requests card here, but no Dashboard link
  const { data: appr } = await sb.rpc('is_leave_approver');
  IS_APPROVER = !!appr;
  await loadMine();
}

var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function tile(dateStr, cls, title, sub){
  var d = new Date(dateStr + 'T00:00:00');
  return '<div class="vic-tile ' + cls + '">'
    + '<div class="vic-tile-day">' + d.getDate() + '</div>'
    + '<div class="vic-tile-mon">' + MONS[d.getMonth()] + ' \u00b7 ' + DOWS[d.getDay()] + '</div>'
    + '<div class="vic-tile-name">' + title + (sub ? '<br>' + sub : '') + '</div>'
    + '</div>';
}


/* ---- LEAVE REQUESTS ---- */
let MY_ID = null;
let IS_ADMIN = false;
let IS_APPROVER = false;
let HOLIDAY_SET = new Set();

function workingDays(from, to){
  var out = [];
  var d = new Date(from + 'T00:00:00');
  var end = new Date(to + 'T00:00:00');
  while(d <= end){
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    var dow = d.getDay();
    if(dow !== 0 && dow !== 6 && !HOLIDAY_SET.has(iso)) out.push(iso);
    d.setDate(d.getDate() + 1);
  }
  return out;
}

async function submitRequest(){
  var msg = document.getElementById('reqMsg');
  msg.className = 'reqmsg';
  var type = document.getElementById('reqType').value;
  var from = document.getElementById('reqFrom').value;
  var to = document.getElementById('reqTo').value || from;
  var hrs = parseFloat(document.getElementById('reqHours').value);
  var why = document.getElementById('reqReason').value.trim();
  if(!MY_ID){ msg.className = 'reqmsg err'; msg.textContent = 'No employee record is linked to this account.'; return; }
  if(!type){ msg.className = 'reqmsg err'; msg.textContent = 'Choose a leave type.'; return; }
  if(!from){ msg.className = 'reqmsg err'; msg.textContent = 'Choose a start date.'; return; }
  if(to < from){ msg.className = 'reqmsg err'; msg.textContent = 'The end date is before the start date.'; return; }
  if(!(hrs > 0)){ msg.className = 'reqmsg err'; msg.textContent = 'Hours per day must be more than zero.'; return; }
  var days = workingDays(from, to);
  if(!days.length){ msg.className = 'reqmsg err'; msg.textContent = 'That range has no working days in it.'; return; }

  msg.textContent = 'Submitting\u2026';
  const { error } = await sb.from('leave_requests').insert({
    employee_id: MY_ID, leave_type: type, start_date: from, end_date: to,
    hours_per_day: hrs, reason: why || null, status: 'Pending'
  });
  if(error){ msg.className = 'reqmsg err'; msg.textContent = error.message; return; }
  msg.className = 'reqmsg ok';
  msg.textContent = 'Submitted \u2014 ' + days.length + ' working day' + (days.length===1?'':'s') + ', ' + (days.length*hrs).toFixed(2) + ' hours. Awaiting approval.';
  document.getElementById('reqType').value = '';
  document.getElementById('reqFrom').value = '';
  document.getElementById('reqTo').value = '';
  document.getElementById('reqReason').value = '';
  await loadRequests();
}

async function withdrawRequest(id){
  const { error } = await sb.from('leave_requests').update({ status: 'Cancelled' }).eq('id', id);
  if(error){ alert(error.message); return; }
  await loadRequests();
}

function rangeLabel(a, b){
  return a === b ? fmtDay(a) : fmtDay(a) + '  \u2192  ' + fmtDay(b);
}

function reqSummary(r){
  var days = workingDays(r.start_date, r.end_date);
  var hrs = days.length * parseFloat(r.hours_per_day || 0);
  return days.length + ' day' + (days.length===1?'':'s') + ' \u00b7 ' + hrs.toFixed(2) + ' hrs \u00b7 ' + r.leave_type;
}

async function loadRequests(){
  // my own requests
  if(MY_ID){
    const mine = await sb.from('leave_requests').select('*').eq('employee_id', MY_ID)
      .order('created_at', { ascending:false });
    var rows = mine.data || [];
    document.getElementById('myReqCount').textContent = rows.length + ' request' + (rows.length===1?'':'s');
    document.getElementById('myRequests').innerHTML = rows.length
      ? rows.map(function(r){
          var cls = r.status.toLowerCase();
          var canWithdraw = r.status === 'Pending';
          return '<div class="rq"><div class="rq-main">'
            + '<div class="rq-when">' + rangeLabel(r.start_date, r.end_date) + '</div>'
            + '<div class="rq-meta">' + reqSummary(r) + (r.reason ? ' \u00b7 ' + r.reason : '')
            + (r.previous_dates ? ' \u00b7 <i>moved from ' + r.previous_dates + '</i>' : '')
            + (r.decision_note ? ' \u00b7 <i>' + r.decision_note + '</i>' : '') + '</div></div>'
            + '<span class="st ' + cls + '">' + r.status + '</span>'
            + (canWithdraw ? '<button class="btn ghost sm" onclick="withdrawRequest(\'' + r.id + '\')">Withdraw</button>' : '')
            + '</div>';
        }).join('')
      : '<div class="empty">No requests yet.</div>';
  }

  if(!IS_ADMIN && !IS_APPROVER) return;

  // requests this person may action, pending first. Admins see everyone; approvers see all staff
  // except admins and other approvers (scope is enforced in Supabase by leave_requests_for_approval).
  const all = await sb.rpc('leave_requests_for_approval');
  if(all.error){ document.getElementById('approvalsCard').style.display = 'none'; return; }
  var list = all.data || [];
  var names = {};
  list.forEach(function(r){ names[r.employee_id] = r.employee_name; });
  var pending = list.filter(function(r){ return r.status === 'Pending'; });
  var rest = list.filter(function(r){ return r.status !== 'Pending'; }).slice(0, 12);
  var ordered = pending.concat(rest);

  document.getElementById('approvalsCard').style.display = 'block';
  document.getElementById('apprCount').textContent = pending.length + ' awaiting approval';
  document.getElementById('approvalsList').innerHTML = ordered.length
    ? ordered.map(function(r){
        var cls = r.status.toLowerCase();
        var acts = '';
        if(r.status === 'Pending'){
          acts = '<button class="btn ok sm" onclick="decide(\'' + r.id + '\',true)">Approve</button>'
               + '<button class="btn no sm" onclick="decide(\'' + r.id + '\',false)">Decline</button>';
        } else if(r.status === 'Approved' && r.start_date > todayISO()){
          acts = '<button class="btn ghost sm" onclick="moveApproved(\'' + r.id + '\')">Move</button>'
               + '<button class="btn ghost sm" onclick="cancelApproved(\'' + r.id + '\')">Cancel</button>';
        }
        return '<div class="rq"><div class="rq-main">'
          + '<div class="rq-when">' + (names[r.employee_id] || '?') + ' \u00b7 ' + rangeLabel(r.start_date, r.end_date) + '</div>'
          + '<div class="rq-meta">' + reqSummary(r) + (r.reason ? ' \u00b7 ' + r.reason : '') + '</div></div>'
          + '<span class="st ' + cls + '">' + r.status + '</span>' + acts + '</div>';
      }).join('')
    : '<div class="empty">No requests.</div>';
}

function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function decide(id, approve){
  // only ask for a note when declining — approvals rarely need one
  var note = approve ? null : (prompt('Reason for declining (optional)') || null);
  const { data, error } = approve
    ? await sb.rpc('approve_leave_request', { req_id: id, note: note })
    : await sb.rpc('decline_leave_request', { req_id: id, note: note });
  if(error){ alert(error.message); return; }
  if(approve) alert('Approved \u2014 ' + data + ' leave day' + (data===1?'':'s') + ' recorded.');
  await loadRequests();
  await loadMine();
}

async function moveApproved(id){
  var d = prompt('New start date (YYYY-MM-DD). The same number of working days will be used.');
  if(!d) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('Please use the format YYYY-MM-DD.'); return; }
  const { data, error } = await sb.rpc('move_leave_request', { req_id: id, new_start: d });
  if(error){ alert(error.message); return; }
  alert(data);
  await loadRequests();
  await loadMine();
}
async function cancelApproved(id){
  if(!confirm('Cancel this approved leave? The days will be removed and the balance restored.')) return;
  var note = prompt('Reason (optional)') || null;
  const { data, error } = await sb.rpc('cancel_leave_request', { req_id: id, note: note });
  if(error){ alert(error.message); return; }
  alert('Cancelled \u2014 ' + data + ' leave day' + (data===1?'':'s') + ' removed.');
  await loadRequests();
  await loadMine();
}
async function loadMine(){
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  document.getElementById('asOf').textContent = 'As at ' + fmtDay(todayStr);

  const { data: myId } = await sb.rpc('my_employee_id');
  MY_ID = myId || null;
  if(!myId){
    document.getElementById('balances').innerHTML = '<div class="empty">No employee record is linked to this account yet. Please contact HR.</div>';
    document.getElementById('leaveList').innerHTML = '<div class="empty">\u2014</div>';
    document.getElementById('leaveCount').textContent = '';
  }

  const seedRes = myId
    ? await sb.from('leave_balances').select('leave_type,seed_balance,seed_date').eq('employee_id', myId)
    : { data: [] };
  const takenRes = myId
    ? await sb.from('leave_entries').select('leave_date,leave_type,hours,note').eq('employee_id', myId).order('leave_date', { ascending:false })
    : { data: [] };
  var rows = seedRes.data || [];
  var used = takenRes.data || [];

  if(rows.length){
    document.getElementById('balances').innerHTML = rows.map(function(r){
      var rate = ACCRUAL[r.leave_type] || 0;
      var accrued = (parseFloat(r.seed_balance)||0) + monthsBetween(r.seed_date, today) * rate;
      // only leave already taken reduces the balance; future bookings shown separately
      var spent = used.filter(function(u){ return u.leave_type === r.leave_type && u.leave_date <= todayStr; })
        .reduce(function(a,u){ return a + (parseFloat(u.hours)||0); }, 0);
      var booked = used.filter(function(u){ return u.leave_type === r.leave_type && u.leave_date > todayStr; })
        .reduce(function(a,u){ return a + (parseFloat(u.hours)||0); }, 0);
      var bal = accrued - spent;
      var cls = r.leave_type === 'Annual Leave' ? 'annual' : 'personal';
      return '<div class="tile ' + cls + '">'
        + '<div class="tile-lbl">' + r.leave_type + '</div>'
        + '<div class="tile-val">' + bal.toFixed(2) + '</div>'
        + '<div class="tile-sub">hours \u00b7 ' + (bal/HOURS_PER_DAY).toFixed(1) + ' days available</div>'
        + '<div class="tile-sub">' + spent.toFixed(2) + ' hrs taken' + (booked ? ' \u00b7 ' + booked.toFixed(2) + ' booked ahead' : '') + '</div>'
        + '</div>';
    }).join('');
  }

  if(myId){
    document.getElementById('leaveCount').textContent = used.length + ' record' + (used.length === 1 ? '' : 's');
    document.getElementById('leaveList').innerHTML = used.length
      ? '<div class="vic-tile-grid">' + used.map(function(u){
          var cls = u.leave_type === 'Annual Leave' ? 'lv-annual' : (u.leave_type === 'Personal Leave' ? 'lv-personal' : 'lv-unpaid');
          var hrs = parseFloat(u.hours) || 0;
          return tile(u.leave_date, cls, u.leave_type.replace(' Leave',''), hrs + 'h \u00b7 ' + (hrs/HOURS_PER_DAY).toFixed(2) + ' d');
        }).join('') + '</div>'
      : '<div class="empty">No leave taken.</div>';
  }

  // Who else is away — planned Annual Leave only, next three months.
  var end = new Date(today.getTime());
  end.setMonth(end.getMonth() + 3);
  var endStr = end.getFullYear() + '-' + String(end.getMonth()+1).padStart(2,'0') + '-' + String(end.getDate()).padStart(2,'0');
  document.getElementById('awayRange').textContent = 'Next 3 months \u00b7 planned leave';
  const awayRes = await sb.rpc('team_annual_leave', { from_date: todayStr, to_date: endStr });
  var away = awayRes.data || [];
  var byDate = {};
  away.forEach(function(a){
    if(!byDate[a.leave_date]) byDate[a.leave_date] = [];
    byDate[a.leave_date].push(a.person.split(' ')[0]);
  });
  var dates = Object.keys(byDate).sort();
  document.getElementById('awayList').innerHTML = dates.length
    ? '<div class="vic-tile-grid">' + dates.map(function(d){
        return tile(d, 'lv-away', byDate[d].join('<br>'), '');
      }).join('') + '</div>'
    : '<div class="empty">Nobody has planned leave in the next three months.</div>';
  const allHol = await sb.from('vic_holidays').select('date,name').order('date');
  HOLIDAY_SET = new Set((allHol.data || []).map(function(x){ return x.date; }));
  var h = (allHol.data || []).filter(function(x){ return x.date >= todayStr; }).slice(0, 12);
  document.getElementById('holidayList').innerHTML = h.length
    ? '<div class="vic-tile-grid">' + h.map(function(x){ return tile(x.date, '', x.name, ''); }).join('') + '</div>'
    : '<div class="empty">No upcoming holidays.</div>';

  await loadRequests();
}

start();
</script>
</body>
</html>
